[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlens"
version = "0.1.0"
description = "Reproducible credit analytics and hypothetical lending policy simulation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.6,<1.8",
  "scipy>=1.12,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
warehouse = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4"]
missingness = ["pyarrow>=23,<24"]

[project.scripts]
creditlens = "creditlens.cli:main"

[tool.setuptools.packages.find]
include = ["creditlens*"]

[tool.setuptools.package-data]
creditlens = ["static/*", "missingness_rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
